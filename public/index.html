*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;overflow-x:hidden;background:#08080f;color:#fff}
button{cursor:pointer;border:none;background:none;font-family:inherit}
input,textarea,select{font-family:inherit}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.8}}
@keyframes rise{0%{transform:translateY(100%) scale(.5);opacity:0}20%{opacity:.5}100%{transform:translateY(-20%) scale(1);opacity:0}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes noteFloat{0%{transform:translateY(0) rotate(0);opacity:.5}100%{transform:translateY(-40px) rotate(15deg);opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes celebrate{0%{transform:scale(0) rotate(-10deg);opacity:0}50%{transform:scale(1.2) rotate(5deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes typing{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
@keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(300px) rotate(720deg);opacity:0}}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
.bang{font-family:'Bangers',cursive;letter-spacing:2px}
.mono{font-family:'Space Mono',monospace}
.shimmer-text{background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 4s linear infinite}
.btn{border-radius:12px;padding:10px 20px;font-family:'Bangers',cursive;font-size:15px;letter-spacing:1.5px;color:#fff;transition:all .2s;cursor:pointer;border:none}
.btn:hover{filter:brightness(1.15);transform:scale(1.02)}
.fade-up{animation:fadeUp .4s ease-out}
.card{border-radius:14px;padding:14px;transition:all .2s}
.chip{border-radius:10px;padding:4px 12px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.overlay{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.screen{min-height:100vh;position:relative;overflow:hidden;padding:16px 16px 80px}
.screen-center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.max-w{max-width:500px;margin:0 auto;position:relative;z-index:1}
.input{width:100%;padding:12px 16px;border-radius:12px;background:rgba(0,0,0,.3);color:#fff;font-size:16px;outline:none}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.flex-center{display:flex;align-items:center;justify-content:center}
.flex-gap{display:flex;gap:6px;align-items:center}
.text-center{text-align:center}
.hidden{display:none!important}

function buildAvatar(base,skinIdx,hairIdx){
  if(!base.supportsSkin)return base.base;
  const skin=SKIN_TONES[skinIdx||0];
  if(skin.id==="default"){
    if(base.supportsHair&&hairIdx>0){
      return base.skinBase+HAIR_STYLES[hairIdx].zwj;
    }
    return base.base;
  }
  let result=base.skinBase+skin.mod;
  if(base.supportsHair&&hairIdx>0){result+=HAIR_STYLES[hairIdx].zwj}
  else if(base.genderZwj){result+=base.genderZwj}
  return result;
}

function getPlan(){return PLANS[S.profile?.plan||S.pendingPlan||"free"]}
function getOnboardPlan(){
  // During onboarding, check if any existing profile has a paid plan
  const paidProfile=S.profiles.find(p=>p.plan&&p.plan!=="free");
  return PLANS[paidProfile?.plan||"free"];
}
function canAccess(feature, count){
  const plan=getPlan();
  const lim=plan.limits;
  if(feature==="subject"){const sub=typeof count==="string"?count:null;if(!lim.subjects)return true;return lim.subjects.includes(sub)}
  if(feature==="world"){if(!lim.worlds)return true;return lim.worlds.includes(count)}
  if(feature==="avatar"){if(!lim.avatarBases)return true;return lim.avatarBases.includes(count)}
  if(feature==="sessions")return(S.profile?.dailySessions||0)<lim.sessionsPerDay;
  if(feature==="challenges")return(S.profile?.dailyChallenges||0)<lim.challengesPerDay;
  if(feature==="photos")return(S.profile?.dailyPhotos||0)<lim.photoUploads;
  if(feature==="profiles")return S.profiles.length<lim.profiles;
  return true;
}
function resetDailyCountsIfNeeded(){
  const p=S.profile;if(!p)return;

}

  /\b(sex|porn|nude|naked|nsfw|onlyfans|xxx|hentai)\b/i,
  /\b(drug|cocaine|heroin|meth|weed|marijuana|vape|juul)\b/i,
  /\b(fuck|shit|bitch|ass ?hole|dick|cock|pussy|cunt|damn|bastard|whore|slut)\b/i,
  /\b(ignore your|ignore all|ignore previous|forget your|forget all|new persona|act as if|pretend you are not|jailbreak|bypass|override)\b/i,
  /\b(where do you live|what's your address|give me your number|how old are you really)\b/i,
];

const REDIRECT_MSG_STUDENT = "Whoa there! 🚀 Let's keep our brains locked onto learning. What [SUBJECT] question can I help you with?";
const REDIRECT_MSG_OUTPUT = "Oops — let me get back on track! What are we working on? I'm ready to help with [SUBJECT]! 💪";

const HINT_PROMPT = `IMPORTANT HINT MODE RULES:
The student has uploaded a homework photo. You MUST follow these rules:
1. NEVER give the direct answer to any problem on the sheet.
2. Instead, give a HINT that helps them think through the problem themselves.
3. Start by identifying what problems are on the sheet and ask which one they want help with.
4. For each hint, guide their thinking with questions like "What do you get when you..." or "Try breaking this into smaller steps..."
5. If they ask for another hint, give a slightly more specific hint — but still do NOT solve it for them.
6. Only confirm if their OWN answer is correct or incorrect.
7. Encourage them with phrases like "You're on the right track!" or "Think about it this way..."
8. If they explicitly say "I give up" or "just tell me the answer", you may explain the solution step-by-step, but remind them they learn more by trying.
9. Keep hints short — 1-2 sentences max per hint.`;

const HINT_LEVELS = [
  {hint:1,desc:"General direction",xp:25},
  {hint:2,desc:"More specific guidance",xp:20},
  {hint:3,desc:"Nearly there",xp:15},
  {hint:4,desc:"Very direct hint",xp:10},
  {hint:5,desc:"Almost giving it away",xp:5},
];
function getHintXP(){
  const h=S.hints.count;
  if(h<=0)return 25;
  if(h>=5)return 5;
  return HINT_LEVELS[h-1]?.xp||5;
}

function checkInput(text){
  if(!text)return{ok:true};
  const lower=text.toLowerCase();
  for(const pattern of BLOCKED_PATTERNS){
    if(pattern.test(lower)){
      return{ok:false,reason:"blocked_pattern"};
    }
  }
  return{ok:true};
}

function filterOutput(text){
  if(!text)return text;
  const lower=text.toLowerCase();
  // Check if AI output somehow contains inappropriate content
  const badOutputPatterns = [
    /\b(sex|porn|nude|naked|nsfw|xxx|hentai)\b/i,
    /\b(fuck|shit|bitch|asshole|dick|cock|pussy|cunt)\b/i,
    /\b(cocaine|heroin|meth)\b/i,
  ];
  for(const pattern of badOutputPatterns){
    if(pattern.test(lower)){
      return REDIRECT_MSG_OUTPUT.replace("[SUBJECT]", S.subject?.label || "your subject");
    }
  }
  return text;
}

// ─── AI ───
async function askAI(messages, sysPrompt){
  const safeSys = SAFETY_PROMPT.trim() + "\n\n" + sysPrompt;
  const payload = {
    model:"claude-sonnet-4-20250514",
    max_tokens:1000,
    system:safeSys,
    messages
  };
  try{
    const r = await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });
    const d = await r.json();
    if(d.error){
      console.error("API returned error:", d.error);
      return "Hmm, something went wrong (" + (d.error.message||"unknown") + "). Try again!";
    }
    const raw = (d.content||[]).map(b=>b.text||"").join("") || "Hmm, I got lost. Try again?";
    return filterOutput(raw);
  }catch(e){
    console.error("Fetch failed:", e.message, e);
    return "Connection issue — please try again! ("+e.message+")";
  }
}

  const labels=stds.map(s=>{const f=[...CURRICULUM.national,...CURRICULUM.states,...CURRICULUM.international].find(c=>c.id===s);return f?f.label:s});

function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):""}
function bgFx(type,accent){
  if(type==="stars")return Array.from({length:18},(_,i)=>`<div style="position:absolute;width:1.5px;height:1.5px;background:#fff;border-radius:50%;top:${i*5.5}%;left:${i*5.3%100}%;animation:twinkle ${2+i*.3}s infinite;animation-delay:${i*.15}s;pointer-events:none"></div>`).join("");

  if(type==="vines")return Array.from({length:5},(_,i)=>`<div style="position:absolute;top:0;left:${i*20%100}%;font-size:${14+i*2}px;opacity:.1;animation:sway ${3+i}s ease-in-out infinite;animation-delay:${i*.4}s;pointer-events:none">🌿</div>`).join("");

  return"";
}
function confettiHTML(t){return`<div style="position:fixed;inset:0;pointer-events:none;z-index:9999">${Array.from({length:30},(_,i)=>`<div style="position:absolute;top:-10%;left:${Math.random()*100}%;width:${8+Math.random()*8}px;height:${8+Math.random()*8}px;background:${[t.accent1,t.accent2,t.accent3,t.success,"#fff"][i%5]};border-radius:${Math.random()>.5?"50%":"2px"};animation:confetti ${1.5+Math.random()*2}s ease-in forwards;animation-delay:${Math.random()*.8}s"></div>`).join("")}</div>`}

async function addXP(amt,reason){
  const p=S.profile;if(!p)return;
  const oldLevel=p.level||1;
  p.xp=(p.xp||0)+amt;p.level=Math.floor(p.xp/XP_PER_LEVEL)+1;
  const leveledUp=p.level>oldLevel;
  await saveProfile(p);
  S.activityLog.unshift({type:"xp",amount:amt,reason,subject:S.subject?.label,profile:p.name,time:Date.now()});
  S.activityLog=S.activityLog.slice(0,200);
  await save("cosmo-activity",S.activityLog);
  if(leveledUp){showConfetti();setTimeout(()=>{S.rewardGame={active:true,level:p.level};render()},1500)}
}
async function updateStreak(){
  const p=S.profile;if(!p)return;
  const today=new Date().toDateString();
  if(p.lastActive===today)return;
  const yest=new Date(Date.now()-86400000).toDateString();
  p.streak=p.lastActive===yest?(p.streak||0)+1:1;
  p.lastActive=today;await saveProfile(p);
}
async function saveProfile(p){
  S.profile=p;
  S.profiles=S.profiles.map(pr=>pr.id===p.id?p:pr);
  if(!S.profiles.find(pr=>pr.id===p.id))S.profiles.push(p);
  await save("cosmo-profiles",S.profiles);
}

        `<div class="text-center" style="animation:celebrate .5s ease-out;padding:20px 0">

function tutorialOverlayHTML(){

  const isFirst=S.tutorial.step===0;

      </div>
      <div class="bang text-center" style="font-size:26px;letter-spacing:2px;margin-bottom:10px">${step.title}</div>

    </div>
  </div></div>`;
}

// Avatar picker functions
function pickAvatarBase(idx){
  S.onboard.avatarBaseIdx=idx;
  const base=AVATAR_BASES[idx];
  if(!base.supportsSkin)S.onboard.avatarSkinIdx=0;
  if(!base.supportsHair)S.onboard.avatarHairIdx=0;
  S.onboard.avatar=buildAvatar(base,S.onboard.avatarSkinIdx,S.onboard.avatarHairIdx);
  render();
}
function pickAvatarSkin(idx){
  S.onboard.avatarSkinIdx=idx;
  const base=AVATAR_BASES[S.onboard.avatarBaseIdx];
  S.onboard.avatar=buildAvatar(base,idx,S.onboard.avatarHairIdx);
  render();
}
function pickAvatarHair(idx){
  S.onboard.avatarHairIdx=idx;
  const base=AVATAR_BASES[S.onboard.avatarBaseIdx];
  S.onboard.avatar=buildAvatar(base,S.onboard.avatarSkinIdx,idx);
  render();
}

function toggleOnboardStd(id){S.onboard.standards.includes(id)?S.onboard.standards=S.onboard.standards.filter(s=>s!==id):S.onboard.standards.push(id);render()}
function removeOnboardStd(id){S.onboard.standards=S.onboard.standards.filter(s=>s!==id);render()}

async function createProfile(){
  if(!S.onboard.name.trim())return;
  const prof={id:Date.now().toString(),name:S.onboard.name.trim(),grade:S.onboard.grade,avatar:S.onboard.avatar,theme:S.onboard.theme,xp:0,level:1,streak:0,lastActive:null,parentPin:S.onboard.pin||"1234",totalSessions:0,standards:S.onboard.standards,studentState:S.onboard.state,plan:S.pendingPlan||"free",created:Date.now()};
  S.pendingPlan=null;
  S.profiles.push(prof);S.profile=prof;S.themeId=S.onboard.theme;
  await save("cosmo-profiles",S.profiles);
  S.activityLog.unshift({type:"profile_created",profile:prof.name,time:Date.now()});
  await save("cosmo-activity",S.activityLog);
  S.screen="home";render();
  if(S.profiles.length===1)setTimeout(()=>{S.tutorial.show=true;render()},600);
}

async function startChat(idx){
  const sub=SUBJECTS[idx];
  resetDailyCountsIfNeeded();
  // Check subject access
  if(!canAccess("subject",sub.label)){S.showPaywall={reason:"subject",subject:sub.label};render();return}
  // Check daily session limit
  if(!canAccess("sessions")){S.showPaywall={reason:"sessions"};render();return}
  S.subject=sub;S.chatMessages=[];S.uploadedImage=null;S.uploadedImageType=null;S.chatInput="";S.hints={active:false,count:0,maxXP:25,problemId:null};S.screen="chat";render();
  await updateStreak();
  const p=S.profile;
  p.dailySessions=(p.dailySessions||0)+1;
  const gradeText=p?`The student is in grade ${p.grade} (name: ${p.name}).`:"";
  const currText=currPrompt(p?.standards,p?.studentState);
  const t=T();
  const intro=await askAI([{role:"user",content:`${gradeText}${currText} We're starting a ${sub.label} session. Give a short enthusiastic greeting and ask what they'd like to work on within ${sub.label}. Keep it to 2 sentences max. Stay focused on ${sub.label} only.`}],t.sysPrompt);
  S.chatMessages=[{role:"assistant",content:intro}];
  if(p){p.totalSessions=(p.totalSessions||0)+1;await saveProfile(p)}
  render();
}

async function sendMessage(hintAction){
  const text=hintAction||S.chatInput.trim();
  if(!text&&!S.uploadedImage)return;
  
  // Client-side content filter
  const check = checkInput(text);
  if(!check.ok){
    const redirectMsg = REDIRECT_MSG_STUDENT.replace("[SUBJECT]", S.subject?.label || "your subject");
    S.chatMessages.push({role:"user",content:text,image:S.uploadedImage||null});
    S.chatMessages.push({role:"assistant",content:redirectMsg});
    S.chatInput="";S.uploadedImage=null;S.uploadedImageType=null;render();
    return;
  }
  
  // Enter hint mode when image is uploaded
  const hasImage=S.uploadedImage||null;
  if(hasImage&&!S.hints.active){
    S.hints={active:true,count:0,maxXP:25,problemId:Date.now()};
  }
  // Track hints
  if(S.hints.active&&(hintAction==="Give me a hint"||hintAction==="One more hint please")){
    S.hints.count++;
  }

  const userMsg={role:"user",content:text,image:hasImage,imageType:S.uploadedImageType||"image/jpeg"};
  S.chatMessages.push(userMsg);S.chatInput="";S.uploadedImage=null;S.uploadedImageType=null;S.isTyping=true;render();
  const t=T(),p=S.profile;
  const apiMsgs=S.chatMessages.map(m=>({role:m.role,content:m.image?[{type:"image",source:{type:"base64",media_type:m.imageType||"image/jpeg",data:m.image}},{type:"text",text:m.content||"Help me with this image"}]:m.content}));
  
  // Build system prompt — add hint rules when in hint mode
  let sys=t.sysPrompt+` Subject: ${S.subject?.label}. Student grade: ${p?.grade||"unknown"}. Student name: ${p?.name||"student"}.${currPrompt(p?.standards,p?.studentState)} Keep responses concise. Stay on topic.`;
  if(S.hints.active){
    sys+="\n\n"+HINT_PROMPT+`\n\nThis is hint #${S.hints.count+1}. The student has used ${S.hints.count} hint(s) so far. ${S.hints.count===0?"Start by looking at the image and asking which problem they want help with.":S.hints.count<=2?"Give a guiding hint — help them think, don't solve.":"They've had several hints. Be more specific but still encourage them to try."}`;
  }else{
    sys+=" If they get an answer right, say so enthusiastically. If wrong, guide them gently.";
  }
  
  const reply=await askAI(apiMsgs,sys);
  S.chatMessages.push({role:"assistant",content:reply});S.isTyping=false;
  
  // XP: less for hints, more for independent work
  if(S.hints.active){
    const earnedXP=getHintXP();
    await addXP(earnedXP,"homework help ("+S.hints.count+" hints)");
  }else{
    await addXP(XP_CHAT,"chat message");
  }
  render();
}

function endHintMode(){
  S.hints={active:false,count:0,maxXP:25,problemId:null};
  render();
}

async function startChallenge(){
  resetDailyCountsIfNeeded();
  if(!canAccess("challenges")){S.showPaywall={reason:"challenges"};render();return}
  S.screen="challenge";S.challengeQ=null;S.challengeSel=null;S.challengeResult=null;render();
  if(S.profile)S.profile.dailyChallenges=(S.profile.dailyChallenges||0)+1;
  await updateStreak();
  const sub=S.subject||SUBJECTS[0],p=S.profile,t=T();
  const currNote=p?.standards?.length?` The question MUST align to: ${currLabel(p.standards)}.${p.studentState?" Student is in "+p.studentState+".":""}`:"";
  const prompt=`Generate a ${sub.label} multiple choice question for a ${p?.grade||"3rd"} grader.${currNote} Respond ONLY in this exact JSON format, nothing else:\n{"question":"...","options":["A) ...","B) ...","C) ...","D) ..."],"correct":0,"explanation":"..."}\nWhere "correct" is the 0-based index of the right answer.`;
  const raw=await askAI([{role:"user",content:prompt}],"You are a quiz generator for children. Respond ONLY with valid JSON. No markdown, no backticks. All questions must be age-appropriate and educational. Never generate questions about violence, drugs, sex, or any inappropriate topic.");
  try{const cl=raw.replace(/```json?\n?/g,"").replace(/```/g,"").trim();S.challengeQ={...JSON.parse(cl),subject:sub}}catch{S.challengeQ={question:"What is 7 × 8?",options:["A) 54","B) 56","C) 48","D) 64"],correct:1,explanation:"7 × 8 = 56",subject:sub}}
  render();
}

async function submitChallenge(){
  if(S.challengeSel===null)return;
  const correct=S.challengeSel===S.challengeQ.correct;
  S.challengeResult=correct?"correct":"wrong";
  if(correct){await addXP(XP_CHALLENGE,"challenge correct");showConfetti()}
  S.activityLog.unshift({type:"challenge",correct,subject:S.challengeQ.subject?.label,question:S.challengeQ.question,profile:S.profile?.name,time:Date.now()});
  S.activityLog=S.activityLog.slice(0,200);await save("cosmo-activity",S.activityLog);
  render();
}

function showConfetti(){const t=T();const m=document.getElementById("confetti-mount");if(m)m.innerHTML=confettiHTML(t);setTimeout(()=>{if(m)m.innerHTML=""},3000)}

function handleImageUpload(e){
  const file=e.target.files?.[0];if(!file)return;
  resetDailyCountsIfNeeded();
  if(!canAccess("photos")){S.showPaywall={reason:"photos"};e.target.value="";render();return}
  // Resize image to max 800px and compress as JPEG for API compatibility
  const img=new Image();
  const reader=new FileReader();
  reader.onload=ev=>{
    img.onload=()=>{
      const maxSize=800;
      let w=img.width,h=img.height;
      if(w>maxSize||h>maxSize){
        if(w>h){h=Math.round(h*(maxSize/w));w=maxSize}
        else{w=Math.round(w*(maxSize/h));h=maxSize}
      }
      const canvas=document.createElement("canvas");
      canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext("2d");
      ctx.drawImage(img,0,0,w,h);
      const dataUrl=canvas.toDataURL("image/jpeg",0.8);
      S.uploadedImage=dataUrl.split(",")[1];
      S.uploadedImageType="image/jpeg";
      if(S.profile)S.profile.dailyPhotos=(S.profile.dailyPhotos||0)+1;
      render();
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value="";
}

const PROMO_CODES={"COSMODEMO":"pro","COSMOFAMILY":"family","ROCKETFUEL":"pro"};
function tryPromoCode(code){
  const plan=PROMO_CODES[code.toUpperCase().trim()];
  if(plan){
    if(S.profile){S.profile.plan=plan;saveProfile(S.profile)}
    // Also store globally so new profiles get it
    S.pendingPlan=plan;
    S.showPaywall=null;S.showUpgrade=false;
    alert("🚀 "+PLANS[plan].name+" plan activated! All features unlocked.");
    render();return true;
  }
  alert("Invalid code. Try: COSMODEMO");return false;
}
function applyPromo(){
  const code=prompt("Enter promo code:");
  if(code)tryPromoCode(code);
}

// ─── Calculator Logic ───
function calcPress(b){
  const c=S.toolData.calc;
  if(b==="C"){c.display="0";c.prev=null;c.op=null;c.fresh=true}
  else if(b==="⌫"){c.display=c.display.length>1?c.display.slice(0,-1):"0"}
  else if(b==="±"){c.display=c.display.startsWith("-")?c.display.slice(1):c.display!=="0"?"-"+c.display:"0"}
  else if(b==="%"){c.display=String(parseFloat(c.display)/100)}
  else if(["+","−","×","÷"].includes(b)){c.prev=parseFloat(c.display);c.op=b;c.fresh=true}
  else if(b==="="){
    if(c.prev!==null&&c.op){
      const cur=parseFloat(c.display);
      let r=0;
      if(c.op==="+")r=c.prev+cur;
      if(c.op==="−")r=c.prev-cur;
      if(c.op==="×")r=c.prev*cur;
      if(c.op==="÷")r=cur!==0?c.prev/cur:"Error";
      if(c.op==="^")r=Math.pow(c.prev,cur);
      c.display=typeof r==="number"?String(Math.round(r*1e10)/1e10):r;
      c.prev=null;c.op=null;c.fresh=true;
    }
  }
  else{
    if(c.fresh&&b!=="."){c.display=b;c.fresh=false}
    else{if(b==="."&&c.display.includes("."))return;c.display+=b;c.fresh=false}
  }
  render();
}
function calcSci(f){
  const c=S.toolData.calc;const v=parseFloat(c.display);
  if(f==="sin")c.display=String(Math.round(Math.sin(v*Math.PI/180)*1e8)/1e8);
  if(f==="cos")c.display=String(Math.round(Math.cos(v*Math.PI/180)*1e8)/1e8);
  if(f==="tan")c.display=String(Math.round(Math.tan(v*Math.PI/180)*1e8)/1e8);
  if(f==="√")c.display=v>=0?String(Math.round(Math.sqrt(v)*1e8)/1e8):"Error";
  if(f==="π")c.display=String(Math.PI);
  if(f==="^"){c.prev=v;c.op="^";c.fresh=true}
  render();
}

// ─── Scratch Pad Logic ───
let scratchColor="#ffffff",scratchSize=4,scratchDrawing=false;
function initScratchPad(){
  const canvas=document.getElementById("scratch-canvas");if(!canvas)return;
  const ctx=canvas.getContext("2d");
  const rect=()=>canvas.getBoundingClientRect();
  const getPos=(e)=>{
    const r=rect();const t=e.touches?e.touches[0]:e;
    return{x:(t.clientX-r.left)*(canvas.width/r.width),y:(t.clientY-r.top)*(canvas.height/r.height)};
  };
  const start=(e)=>{e.preventDefault();scratchDrawing=true;const p=getPos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};
  const draw=(e)=>{if(!scratchDrawing)return;e.preventDefault();const p=getPos(e);ctx.lineTo(p.x,p.y);ctx.strokeStyle=scratchColor;ctx.lineWidth=scratchSize;ctx.lineCap="round";ctx.lineJoin="round";ctx.stroke()};
  const end=()=>{scratchDrawing=false};
  canvas.addEventListener("mousedown",start);canvas.addEventListener("mousemove",draw);canvas.addEventListener("mouseup",end);canvas.addEventListener("mouseleave",end);
  canvas.addEventListener("touchstart",start,{passive:false});canvas.addEventListener("touchmove",draw,{passive:false});canvas.addEventListener("touchend",end);
}
function clearScratch(){const c=document.getElementById("scratch-canvas");if(c)c.getContext("2d").clearRect(0,0,c.width,c.height)}

  {level:8,name:"Mega Cannon",desc:"5-way devastation!",color:"#FFD700",fireRate:200,bullets:5,bulletSpeed:8,shipSpeed:8,shield:true,pierce:true,spread:0.15},

function getUpgrade(level){return UPGRADES[Math.min(level-1,UPGRADES.length-1)];}

let gameInstance=null;
function launchRewardGame(){
  const t=T();const lvl=S.rewardGame?.level||1;const up=getUpgrade(lvl);
  render(); // render the overlay first
  setTimeout(()=>{
    const canvas=document.getElementById("game-canvas");if(!canvas)return;
    const ctx=canvas.getContext("2d");
    const W=canvas.width,H=canvas.height;

    // Game state
    let ship={x:W/2,y:H-50,w:24,h:24,shield:up.shield,shieldHits:0};
    let bullets=[];let asteroids=[];let particles=[];let stars=[];
    let score=0;let gameOver=false;let lastFire=0;let frame=0;
    let keys={left:false,right:false,up:false,space:false};

    // Generate starfield
    for(let i=0;i<50;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+0.5,sp:Math.random()*0.5+0.2});

    // Spawn asteroids
    function spawnAsteroid(){
      const size=15+Math.random()*25;
      asteroids.push({x:Math.random()*W,y:-size,size,speed:1+Math.random()*2,rot:Math.random()*Math.PI*2,rotSpeed:(Math.random()-0.5)*0.04,hp:size>25?2:1});
    }

    // Input
    function kd(e){
      if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
      if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
      if(e.key==="ArrowUp"||e.key==="w")keys.up=true;
      if(e.key===" ")keys.space=true;
    }
    function ku(e){
      if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
      if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
      if(e.key==="ArrowUp"||e.key==="w")keys.up=false;
      if(e.key===" ")keys.space=false;
    }
    document.addEventListener("keydown",kd);document.addEventListener("keyup",ku);

    // Touch controls
    let touchX=null;
    canvas.addEventListener("touchstart",(e)=>{e.preventDefault();touchX=e.touches[0].clientX;keys.space=true},{passive:false});
    canvas.addEventListener("touchmove",(e)=>{e.preventDefault();const newX=e.touches[0].clientX;if(touchX!==null){if(newX<touchX-10)keys.left=true,keys.right=false;else if(newX>touchX+10)keys.right=true,keys.left=false;else keys.left=false,keys.right=false}touchX=newX},{passive:false});
    canvas.addEventListener("touchend",()=>{keys.left=false;keys.right=false;keys.space=false;touchX=null});

    function fire(){
      const now=Date.now();if(now-lastFire<up.fireRate)return;lastFire=now;
      for(let i=0;i<up.bullets;i++){
        const angle=-Math.PI/2+(i-(up.bullets-1)/2)*up.spread;
        bullets.push({x:ship.x,y:ship.y-12,vx:Math.sin(angle)*up.bulletSpeed,vy:Math.cos(angle)*-up.bulletSpeed,pierce:up.pierce});
      }
    }

    function addParticles(x,y,color,count){
      for(let i=0;i<count;i++){
        const angle=Math.random()*Math.PI*2;const speed=Math.random()*3+1;
        particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:30+Math.random()*20,maxLife:50,color,size:Math.random()*3+1});
      }
    }

    function update(){
      if(gameOver)return;frame++;
      // Move ship
      if(keys.left)ship.x-=up.shipSpeed;
      if(keys.right)ship.x+=up.shipSpeed;
      if(keys.up)ship.y-=up.shipSpeed*0.5;
      ship.x=Math.max(12,Math.min(W-12,ship.x));
      ship.y=Math.max(H*0.3,Math.min(H-20,ship.y));
      if(!keys.up)ship.y=Math.min(ship.y+1,H-50);

      // Fire
      if(keys.space)fire();

      // Move bullets
      bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy});
      bullets=bullets.filter(b=>b.x>0&&b.x<W&&b.y>0&&b.y<H);

      // Spawn asteroids
      if(frame%40===0)spawnAsteroid();
      if(frame>300&&frame%80===0)spawnAsteroid(); // more asteroids over time

      // Move asteroids
      asteroids.forEach(a=>{a.y+=a.speed;a.rot+=a.rotSpeed});

      // Collision: bullets vs asteroids
      for(let i=asteroids.length-1;i>=0;i--){
        const a=asteroids[i];
        for(let j=bullets.length-1;j>=0;j--){
          const b=bullets[j];
          const dx=a.x-b.x,dy=a.y-b.y,dist=Math.sqrt(dx*dx+dy*dy);
          if(dist<a.size){
            a.hp--;
            if(!b.pierce)bullets.splice(j,1);
            if(a.hp<=0){
              score+=Math.round(a.size);
              addParticles(a.x,a.y,up.color,8);
              asteroids.splice(i,1);
            }else{addParticles(a.x,a.y,"#888",3)}
            break;
          }
        }
      }

      // Collision: asteroids vs ship
      for(let i=asteroids.length-1;i>=0;i--){
        const a=asteroids[i];
        const dx=a.x-ship.x,dy=a.y-ship.y,dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<a.size+10){
          if(ship.shield&&ship.shieldHits===0){
            ship.shieldHits=1;addParticles(ship.x,ship.y,"#3B82F6",12);
            asteroids.splice(i,1);
          }else{
            gameOver=true;addParticles(ship.x,ship.y,"#FF1744",20);
          }
        }
      }

      // Remove off-screen asteroids
      asteroids=asteroids.filter(a=>a.y<H+50);

      // Update particles
      particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;p.vx*=0.96;p.vy*=0.96});
      particles=particles.filter(p=>p.life>0);

      // Stars
      stars.forEach(s=>{s.y+=s.sp;if(s.y>H){s.y=0;s.x=Math.random()*W}});
    }

    function draw(){
      ctx.clearRect(0,0,W,H);

      // Stars
      stars.forEach(s=>{ctx.fillStyle=`rgba(255,255,255,${0.3+Math.sin(frame*0.02+s.x)*0.2})`;ctx.fillRect(s.x,s.y,s.s,s.s)});

      // Particles
      particles.forEach(p=>{ctx.globalAlpha=p.life/p.maxLife;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()});
      ctx.globalAlpha=1;

      // Bullets
      bullets.forEach(b=>{
        ctx.fillStyle=up.color;ctx.shadowColor=up.color;ctx.shadowBlur=6;
        ctx.fillRect(b.x-1.5,b.y-4,3,8);
      });
      ctx.shadowBlur=0;

      // Asteroids
      asteroids.forEach(a=>{
        ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.rot);
        ctx.fillStyle=a.hp>1?"#888":"#666";ctx.strokeStyle="#999";ctx.lineWidth=1.5;
        ctx.beginPath();
        for(let i=0;i<7;i++){const angle=(i/7)*Math.PI*2;const r=a.size*(0.7+Math.sin(i*2.5)*0.3);ctx.lineTo(Math.cos(angle)*r,Math.sin(angle)*r)}
        ctx.closePath();ctx.fill();ctx.stroke();
        ctx.restore();
      });

      if(!gameOver){
        // Ship
        ctx.save();ctx.translate(ship.x,ship.y);
        ctx.fillStyle=up.color;ctx.strokeStyle="#fff";ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(-10,10);ctx.lineTo(0,6);ctx.lineTo(10,10);ctx.closePath();ctx.fill();ctx.stroke();
        // Engine glow
        if(frame%4<2){ctx.fillStyle="#FF6B35";ctx.beginPath();ctx.moveTo(-4,8);ctx.lineTo(0,16+Math.random()*6);ctx.lineTo(4,8);ctx.fill()}
        // Shield
        if(ship.shield&&ship.shieldHits===0){ctx.strokeStyle="rgba(59,130,246,0.5)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.stroke();ctx.strokeStyle="rgba(59,130,246,0.2)";ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.stroke()}
        ctx.restore();
      }

      // HUD
      ctx.fillStyle="#fff";ctx.font="bold 14px 'Nunito',sans-serif";ctx.textAlign="left";
      ctx.fillText("Score: "+score,10,24);
      ctx.textAlign="right";
      ctx.fillStyle=up.color;ctx.fillText(up.name,W-10,24);
      if(ship.shield){ctx.fillStyle=ship.shieldHits===0?"#3B82F6":"#FF174488";ctx.font="11px 'Nunito',sans-serif";ctx.fillText(ship.shieldHits===0?"🛡️ Shield Active":"🛡️ Shield Broken",W-10,42)}

      // Game over
      if(gameOver){
        ctx.fillStyle="rgba(0,0,0,0.6)";ctx.fillRect(0,0,W,H);
        ctx.fillStyle="#fff";ctx.font="bold 28px 'Bangers',cursive";ctx.textAlign="center";ctx.letterSpacing="3px";
        ctx.fillText("MISSION COMPLETE",W/2,H/2-30);
        ctx.font="bold 18px 'Bangers',cursive";ctx.fillStyle=up.color;
        ctx.fillText("Score: "+score,W/2,H/2+10);
        ctx.font="14px 'Nunito',sans-serif";ctx.fillStyle="rgba(255,255,255,0.5)";
        ctx.fillText("Tap or press any key to continue",W/2,H/2+45);
      }
    }

    function loop(){
      update();draw();
      if(!gameOver)gameInstance=requestAnimationFrame(loop);
      else{
        draw(); // final frame
        const exitHandler=(e)=>{
          e.preventDefault();
          document.removeEventListener("keydown",kd);document.removeEventListener("keyup",ku);
          document.removeEventListener("keydown",exitHandler);canvas.removeEventListener("touchstart",exitHandler);
          if(gameInstance)cancelAnimationFrame(gameInstance);
          S.rewardGame=null;render();
        };
        setTimeout(()=>{document.addEventListener("keydown",exitHandler);canvas.addEventListener("touchstart",exitHandler,{passive:false})},500);
      }
    }
    loop();
  },200);
}
